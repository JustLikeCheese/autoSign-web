<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Dashboard</title>
  <link rel="stylesheet" href="loader.css">
  <script type="module" src="loader.js"></script>
</head>
<body>
  <main class="gate" id="gate" hidden>
    <form id="form" class="card" autocomplete="off">
      <div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-3 3 3 3m-6 0 2 2"/></svg></div>
      <h1>需要访问密钥</h1>
      <p>粘贴密钥，或选择密钥文件。验证一次后这台设备会记住。</p>
      <input id="key" type="password" placeholder="autosign-…" spellcheck="false" autocapitalize="off">
      <label class="file"><input id="file" type="file" accept=".key,.txt,text/plain"><span>选择密钥文件</span></label>
      <button id="submit" type="submit">解锁</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>
  </main>
  <p class="boot" id="boot">正在加载…</p>
</body>
</html>
